[project]
name = "eai-pmo-tools"
version = "0.1.0"
description = "Starter tooling for the SCRM AI/ML Weekly Reporting Suite and RTB team operating model"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["reporting/src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
