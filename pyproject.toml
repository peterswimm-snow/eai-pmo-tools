[project]
name = "eai-pmo-tools"
version = "0.1.0"
description = "Starter tooling for the SCRM AI/ML Weekly Reporting Suite and RTB team operating model"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
inventory = ["openpyxl>=3.1,<4"]

[project.scripts]
pmo-aict-change-plan = "eai_pmo_tools.aict_change_plan:main"
pmo-aict-review = "eai_pmo_tools.aict_review:main"
pmo-aict-workbooks = "eai_pmo_tools.aict_workbooks:main"

[tool.setuptools.packages.find]
where = ["reporting/src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
